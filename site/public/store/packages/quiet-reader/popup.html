<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>Quiet Reader</title>
</head>
<body>
  <main>
    <span class="eyebrow">QUIET READER</span>
    <h1 id="state">Ready</h1>
    <p id="hint">Turn the current article into a calm reading surface. Click again to leave it.</p>
    <button id="toggle" type="button">Open reader</button>
    <small id="support">Works on the page you are looking at.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
