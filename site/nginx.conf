server {
  listen 80; server_name _; root /usr/share/nginx/html; index index.html;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(css|js|svg|png|webp|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
