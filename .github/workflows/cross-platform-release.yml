name: Build Flowr for macOS and Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to update
        required: true
        default: v1.1.2

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            command: dist:linux
            artifact: flowr-linux-x64
          - runner: macos-14
            command: dist:mac:x64
            artifact: flowr-macos-x64
          - runner: macos-14
            command: dist:mac:arm64
            artifact: flowr-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:adblock
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release_v5/*.AppImage
            release_v5/*.dmg
            release_v5/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flowr-*
          path: artifacts
          merge-multiple: true
      - name: Attach builds to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber --repo "${{ github.repository }}"
